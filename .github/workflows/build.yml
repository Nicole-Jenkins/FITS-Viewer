name: Build Executables

# Two ways to trigger this:
# 1. Automatically, whenever you publish a GitHub Release - the built
#    files get attached to that release automatically.
# 2. Manually, from the Actions tab ("Run workflow" button) - useful
#    for testing a build without publishing a release yet. Files show
#    up as downloadable "artifacts" on that run instead.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write  # needed to attach files to a release

jobs:
  build:
    strategy:
      fail-fast: false  # if one OS's build fails, still let the others finish
      matrix:
        include:
          - os: windows-latest
            packaging: file
            asset_name: FITS-Viewer-Windows.exe
            build_path: dist/FITS Viewer.exe
          # Mac output is a real .app bundle now (see FitsViewer.spec) so
          # the normal Gatekeeper right-click-Open flow works - but a
          # .app is a folder, not a single file, so it needs zipping
          # before it can be uploaded/downloaded as one file.
          - os: macos-latest
            packaging: mac_app_zip
            asset_name: FITS-Viewer-macOS.zip
          # AppImage: a single self-contained file most Linux desktop
          # environments can run directly after one "allow execute"
          # toggle, unlike the previous raw binary which apparently
          # didn't even launch from a file manager for one user.
          - os: ubuntu-latest
            packaging: appimage
            asset_name: FITS-Viewer-Linux.AppImage

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller FitsViewer.spec

      # --- Windows: just rename/copy the single exe ---
      - name: Package (Windows)
        if: matrix.packaging == 'file'
        shell: bash
        run: |
          mkdir -p release_output
          cp "${{ matrix.build_path }}" "release_output/${{ matrix.asset_name }}"

      # --- Mac: zip the .app bundle, preserving it as a real bundle
      #     rather than a flat file list (ditto is the Apple-recommended
      #     tool for this, cp/zip alone can mangle bundle structure) ---
      - name: Package (macOS)
        if: matrix.packaging == 'mac_app_zip'
        shell: bash
        run: |
          mkdir -p release_output
          ditto -c -k --sequesterRsrc --keepParent "dist/FITS Viewer.app" "release_output/${{ matrix.asset_name }}"

      # --- Linux: wrap the onefile binary in a minimal AppDir and run
      #     appimagetool to produce a proper AppImage. Placeholder icon
      #     used here (plain colour square) since there's no custom app
      #     icon yet - see README roadmap. Swap AppDir/fitsviewer.png
      #     for a real one once that's made, no other changes needed. ---
      - name: Package (Linux AppImage)
        if: matrix.packaging == 'appimage'
        shell: bash
        run: |
          mkdir -p release_output
          mkdir -p AppDir/usr/bin
          cp "dist/FITS Viewer" AppDir/usr/bin/fitsviewer
          chmod +x AppDir/usr/bin/fitsviewer

          cat > AppDir/AppRun << 'EOF'
          #!/bin/sh
          HERE=$(dirname "$(readlink -f "$0")")
          exec "$HERE/usr/bin/fitsviewer" "$@"
          EOF
          chmod +x AppDir/AppRun

          cat > AppDir/fitsviewer.desktop << 'EOF'
          [Desktop Entry]
          Type=Application
          Name=FITS Viewer
          Exec=fitsviewer
          Icon=fitsviewer
          Categories=Graphics;Science;
          EOF

          python -c "from PIL import Image; Image.new('RGBA', (256, 256), (56, 132, 255, 255)).save('AppDir/fitsviewer.png')"

          wget -q "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage" -O appimagetool
          chmod +x appimagetool
          ./appimagetool --appimage-extract-and-run AppDir "release_output/${{ matrix.asset_name }}"

      # Always available as a downloadable artifact on the workflow run,
      # even for manual test runs with no release attached.
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: release_output/${{ matrix.asset_name }}

      # Only runs when triggered by actually publishing a release.
      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: release_output/${{ matrix.asset_name }}
